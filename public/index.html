<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!--
      ==================================================================
      SEO - META UTAMA (satu-satunya sumber meta halaman)
      Ubah URL produksi di 4 tempat bila domain berganti:
        1. <link rel="canonical">       (di bawah)
        2. og:url + og:image + twitter:image (di bawah)
        3. public/sitemap.xml  &  public/robots.txt
        4. SITE_URL pada src/utils/seo.js (JSON-LD)
      ==================================================================
    -->
    <title>Kafeinarts — Jasa SaaS, Website &amp; Sistem Manajemen di Depok</title>
    <meta
      name="description"
      content="Kafeinarts Interactive: mitra teknis SaaS full-stack, pembuatan website &amp; aplikasi, cloud dan keamanan sistem di Depok, Jawa Barat. Konsultasi gratis!"
    />
    <meta
      name="keywords"
      content="Kafeinarts, jasa SaaS, jasa pembuatan website, jasa aplikasi, sistem manajemen, pengembang web Depok, cloud, keamanan sistem, Jawa Barat"
    />
    <meta name="author" content="Kafeinarts Interactive" />
    <meta name="creator" content="Kafeinarts Interactive" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://kafeinarts.vercel.app/" />
    <meta name="theme-color" content="#00205D" />
    <meta name="color-scheme" content="light" />

    <!-- Local SEO (Indonesia - Depok, Jawa Barat) -->
    <meta name="geo.region" content="ID-JB" />
    <meta name="geo.placename" content="Depok, Jawa Barat" />
    <meta name="geo.position" content="-6.4025;106.7942" />
    <meta name="ICBM" content="-6.4025, 106.7942" />

    <!-- Favicons - Kafeinarts only -->
    <link href="<%= BASE_URL %>assets/img/logo.png" rel="icon" />
    <link href="<%= BASE_URL %>assets/img/logo.png" rel="apple-touch-icon" />
    <link href="<%= BASE_URL %>assets/img/logo.png" rel="icon" type="image/png" />
    <meta name="apple-mobile-web-app-title" content="Kafeinarts" />

    <!--
      Open Graph (Facebook, LinkedIn, WhatsApp) & Twitter/X Card
      Gambar sosial: 1200x630 -> public/assets/img/og-image.png
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kafeinarts Interactive" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:url" content="https://kafeinarts.vercel.app/" />
    <meta property="og:title" content="Kafeinarts — Jasa SaaS, Website &amp; Sistem Manajemen di Depok" />
    <meta
      property="og:description"
      content="Mitra teknis SaaS full-stack, pembuatan website &amp; aplikasi, cloud dan keamanan sistem untuk bisnis Anda. Depok, Jawa Barat."
    />
    <meta property="og:image" content="https://kafeinarts.vercel.app/assets/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Kafeinarts Interactive - Mitra SaaS, Website & Sistem Manajemen" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kafeinarts — Jasa SaaS, Website &amp; Sistem Manajemen di Depok" />
    <meta
      name="twitter:description"
      content="Mitra teknis SaaS full-stack, pembuatan website &amp; aplikasi, cloud dan keamanan sistem untuk bisnis Anda. Depok, Jawa Barat."
    />
    <meta name="twitter:image" content="https://kafeinarts.vercel.app/assets/img/og-image.png" />
    <meta name="twitter:image:alt" content="Kafeinarts Interactive - Mitra SaaS, Website & Sistem Manajemen" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Jost:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Vendor CSS Files (dipakai komponen Vue: grid, ikon, animasi, slider) -->
    <link href="<%= BASE_URL %>assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="<%= BASE_URL %>assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="<%= BASE_URL %>assets/vendor/aos/aos.css" rel="stylesheet" />
    <link href="<%= BASE_URL %>assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" />

    <!-- Main CSS File -->
    <link href="<%= BASE_URL %>assets/css/main.css" rel="stylesheet" />
  </head>

  <body class="index-page">
    <noscript>
      <strong>
        Mohon maaf, Kafeinarts membutuhkan JavaScript agar halaman dapat ditampilkan dengan baik.
      </strong>
    </noscript>

    <div id="app"></div>

    <!-- Vendor JS Files (global: bootstrap, window.AOS, window.Swiper) -->
    <script src="<%= BASE_URL %>assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="<%= BASE_URL %>assets/vendor/aos/aos.js"></script>
    <script src="<%= BASE_URL %>assets/vendor/swiper/swiper-bundle.min.js"></script>

    <!-- built files will be auto injected -->
  </body>
</html>
