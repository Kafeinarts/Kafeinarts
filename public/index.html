<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Kafeinarts - Mitra Digital SaaS &amp; Sistem Manajemen</title>
    <meta
      name="description"
      content="Kafeinarts Interactive - Mitra teknis andal SaaS full-stack, website, aplikasi, cloud & keamanan. Depok, Jawa Barat."
    />
    <meta
      name="keywords"
      content="Kafeinarts, SaaS, Website, Aplikasi, Cloud, Depok"
    />

    <!-- Favicons - Kafeinarts only -->
    <link href="<%= BASE_URL %>assets/img/logo.png" rel="icon" />
    <link href="<%= BASE_URL %>assets/img/logo.png" rel="apple-touch-icon" />
    <link href="<%= BASE_URL %>assets/img/logo.png" rel="icon" type="image/png" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Jost:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Vendor CSS Files (dipakai komponen Vue: grid, ikon, animasi, slider) -->
    <link href="<%= BASE_URL %>assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="<%= BASE_URL %>assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="<%= BASE_URL %>assets/vendor/aos/aos.css" rel="stylesheet" />
    <link href="<%= BASE_URL %>assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet" />

    <!-- Main CSS File -->
    <link href="<%= BASE_URL %>assets/css/main.css" rel="stylesheet" />
  </head>

  <body class="index-page">
    <noscript>
      <strong>
        Mohon maaf, Kafeinarts membutuhkan JavaScript agar halaman dapat ditampilkan dengan baik.
      </strong>
    </noscript>

    <div id="app"></div>

    <!-- Vendor JS Files (global: bootstrap, window.AOS, window.Swiper) -->
    <script src="<%= BASE_URL %>assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="<%= BASE_URL %>assets/vendor/aos/aos.js"></script>
    <script src="<%= BASE_URL %>assets/vendor/swiper/swiper-bundle.min.js"></script>

    <!-- built files will be auto injected -->
  </body>
</html>
